name: Build NeoForge mod
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'scripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test standalone transfer logic
        run: |
          bash scripts/test-core.sh
          bash scripts/test-bridge.sh
          bash scripts/test-buffer-gui.sh
          bash scripts/test-security.sh
      - name: Validate recipe and model JSON
        run: python3 scripts/check-resources.py
      - name: Compile Minecraft / NeoForge project
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace build 2>&1 | tee neoforge-build.log
      - name: Save build log (successful or failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frequencyworks-build-log
          path: neoforge-build.log
          if-no-files-found: ignore
      - name: Upload mod jar if build succeeds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frequencyworks-neoforge-jar
          path: build/libs/frequencyworks-*.jar
          if-no-files-found: error
